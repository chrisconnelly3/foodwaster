# fly.toml app configuration file generated for foodwaster on 2026-06-08T14:50:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'foodwaster'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_TZ = 'America/Chicago'
  DATA_DIR = '/app/data'
  PORT = '8080'

[[mounts]]
  source = 'foodwaster_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
