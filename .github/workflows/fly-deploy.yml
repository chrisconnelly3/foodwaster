name: Deploy to Fly

# Auto-deploys to Fly.io on every push to main.
# Requires a repo secret FLY_API_TOKEN (create with: fly tokens create deploy -x 999999h
# then: gh secret set FLY_API_TOKEN).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group   # never run two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
